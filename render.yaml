services:
  - type: web
    name: fleetflow-api
    env: node
    rootDir: backend
    buildCommand: npm ci --no-audit --no-fund
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: test
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_RECOVERY_KEY
        sync: false
      - key: CORS_ALLOW_ALL
        value: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Bangkok

  - type: web
    name: fleetflow-site
    env: static
    rootDir: frontend
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_URL
        sync: false
